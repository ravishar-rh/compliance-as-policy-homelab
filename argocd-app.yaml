---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: compliance-as-policy-homelab
  namespace: openshift-gitops
spec:
  project: default
  source:
    repoURL: https://github.com/ravishar-rh/compliance-as-policy-homelab.git
    targetRevision: main
    path: .
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 10
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 5m
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
