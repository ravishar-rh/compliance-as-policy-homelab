---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: compliance-as-policy-homelab
  namespace: openshift-gitops
spec:
  project: default
  source:
    repoURL: https://github.com/ravishar-rh/compliance-as-policy-homelab.git
    targetRevision: main
    path: .
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
